name: Publish release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re
          import tomllib

          metadata = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          version = metadata["project"]["version"]
          source = pathlib.Path("src/ssml_h/__init__.py").read_text(encoding="utf-8")
          match = re.search(r'^__version__ = "([^"]+)"$', source, re.MULTILINE)
          assert match, "Missing ssml_h.__version__"
          changelog = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          expected = f"v{version}"
          assert os.environ["RELEASE_TAG"] == expected, (os.environ["RELEASE_TAG"], expected)
          assert match.group(1) == version, (match.group(1), version)
          assert f"## {version} - Unreleased" not in changelog, "Date the changelog before publishing"
          PY
      - name: Install build tools
        run: python -m pip install -e ".[test]"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check source
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Build distributions
        run: python -m build
      - name: Check metadata
        run: python -m twine check dist/*
      - uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ssml-h-tools/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish package distributions
        uses: pypa/gh-action-pypi-publish@release/v1
